version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hireflow-postgres
    environment:
      POSTGRES_DB: hireflow_db
      POSTGRES_USER: hireflow_user
      POSTGRES_PASSWORD: hireflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow_user -d hireflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hireflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hireflow_db
      SPRING_DATASOURCE_USERNAME: hireflow_user
      SPRING_DATASOURCE_PASSWORD: hireflow_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      HIREFLOW_JWT_PRIVATE_KEY: ${HIREFLOW_JWT_PRIVATE_KEY:-}
      HIREFLOW_JWT_PUBLIC_KEY: ${HIREFLOW_JWT_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
